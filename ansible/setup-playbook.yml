- name: Install docker and jenkins
  hosts: ec2app
  become: yes

  tasks:
  - name: Install docker
    apt:
      name: docker.io
      state: present

  - name: start and enable docker
    systemd:
      name: docker
      enabled: yes
      state: started
  - name: Add ubuntu user to a group
    user:
      name: ubuntu
      groups: docker
      append: yes
  - name: Install java
    apt:
      name: openjdk-21-jre
      state: present

  - name: Download Jenkins GPG key
    ansible.builtin.get_url:
      url: https://pkg.jenkins.io/debian-stable/jenkins.io-2026.key
      dest: /etc/apt/keyrings/jenkins-keyring.asc
      mode: '0644'

  - name: Add Jenkins repository
    ansible.builtin.apt_repository:
      repo: "deb [signed-by=/etc/apt/keyrings/jenkins-keyring.asc] https://pkg.jenkins.io/debian-stable binary/"
      state: present
      filename: jenkins.list


  - name: Install Jenkins
    apt:
      name: jenkins
      state: present

  - name: Enable and start Jenkins
    systemd:
      name: jenkins
      enabled: yes
      state: started